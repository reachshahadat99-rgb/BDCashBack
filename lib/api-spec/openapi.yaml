components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketplaceCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        productCount:
          type: number
      required: [id, name, icon, productCount]
    MarketplaceProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        cashbackPercent:
          type: number
        rating:
          type: number
        reviewCount:
          type: number
        image:
          type: string
        badge:
          type: ["string", "null"]
        merchant:
          type: string
      required: [id, name, brand, category, price, originalPrice, cashbackPercent, rating, reviewCount, image, badge, merchant]
    MarketplaceDeal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        accent:
          type: string
        endsAt:
          type: string
        cashbackPercent:
          type: number
      required: [id, title, subtitle, accent, endsAt, cashbackPercent]
    WalletSummary:
      type: object
      properties:
        balance:
          type: number
        pendingCashback:
          type: number
        availableCashback:
          type: number
        rewardPoints:
          type: number
      required: [balance, pendingCashback, availableCashback, rewardPoints]
    WalletTransaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        amount:
          type: number
        description:
          type: string
        referenceId:
          type: ["string", "null"]
        referenceType:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, type, amount, description, referenceId, referenceType, createdAt]
    WithdrawalRequest:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        status:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        notes:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, amount, status, bankName, accountNumber, notes, createdAt, updatedAt]
    CreateWithdrawalRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        bankName:
          type: string
        accountNumber:
          type: string
        notes:
          type: string
      required: [amount, bankName, accountNumber]
    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        storeId:
          type: string
        name:
          type: string
        imageUrl:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        cashbackPercent:
          type: number
        cashbackAmount:
          type: number
        quantity:
          type: number
      required: [id, productId, storeId, name, imageUrl, price, originalPrice, cashbackPercent, cashbackAmount, quantity]
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        cashbackAmount:
          type: number
        itemsCount:
          type: number
      required: [items, subtotal, cashbackAmount, itemsCount]
    AddToCartRequest:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: number
      required: [productId, quantity]
    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: number
      required: [quantity]
    CheckoutRequest:
      type: object
      required: [deliveryAddress]
      properties:
        couponCode:
          type: string
          description: Optional coupon code to apply at checkout
        deliveryAddress:
          type: object
          required: [name, phone, address, city]
          description: Delivery address captured during checkout
          properties:
            name:
              type: string
              minLength: 1
            phone:
              type: string
              minLength: 1
            address:
              type: string
              minLength: 1
            city:
              type: string
              minLength: 1
    CustomerOrder:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: number
        cashbackAmount:
          type: number
        discountAmount:
          type: number
        couponCode:
          type: ["string", "null"]
        itemsCount:
          type: number
        deliveredAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, status, total, cashbackAmount, discountAmount, couponCode, itemsCount, deliveredAt, completedAt, createdAt, updatedAt]
    CustomerOrderItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        storeId:
          type: string
        name:
          type: string
        imageUrl:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        cashbackPercent:
          type: number
        cashbackAmount:
          type: number
        quantity:
          type: number
      required: [id, productId, storeId, name, imageUrl, price, originalPrice, cashbackPercent, cashbackAmount, quantity]
    CustomerOrderDetail:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: number
        cashbackAmount:
          type: number
        discountAmount:
          type: number
        couponCode:
          type: ["string", "null"]
        itemsCount:
          type: number
        deliveredAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerOrderItem"
      required: [id, status, total, cashbackAmount, discountAmount, couponCode, itemsCount, deliveredAt, completedAt, createdAt, updatedAt, items]
    MarketplaceSummary:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceCategory"
        featuredProducts:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceProduct"
        deals:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceDeal"
        wallet:
          $ref: "#/components/schemas/WalletSummary"
      required: [categories, featuredProducts, deals, wallet]
    MerchantStore:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        logoUrl: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, name, slug, description, logoUrl, status, createdAt, updatedAt]
    CreateMerchantStoreRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        logoUrl: { type: string }
      required: [name]
    MerchantProduct:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        name: { type: string }
        description: { type: string }
        brand: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        cashbackPercent: { type: number }
        imageUrl: { type: string }
        stock: { type: number }
        available: { type: boolean }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, storeId, categoryId, categoryName, name, description, brand, price, originalPrice, cashbackPercent, imageUrl, stock, available, status, createdAt, updatedAt]
    CreateMerchantProductRequest:
      type: object
      properties:
        categoryId: { type: string }
        name: { type: string }
        description: { type: string }
        brand: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        cashbackPercent: { type: number }
        imageUrl: { type: string }
        stock: { type: number }
        available: { type: boolean }
      required: [categoryId, name, brand, price, originalPrice, cashbackPercent, imageUrl, stock, available]
    UpdateMerchantProductRequest:
      type: object
      properties:
        categoryId: { type: string }
        name: { type: string }
        description: { type: string }
        brand: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        cashbackPercent: { type: number }
        imageUrl: { type: string }
        stock: { type: number }
        available: { type: boolean }
        status: { type: string }
    MerchantOrder:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        customerId: { type: string }
        total: { type: number }
        cashback: { type: number }
        itemsCount: { type: number }
        status: { type: string }
        createdAt: { type: string }
      required: [id, storeId, customerId, total, cashback, itemsCount, status, createdAt]
    GroupBuyDeal:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        image: { type: string }
        category: { type: string }
        originalPrice: { type: number }
        groupPrice: { type: number }
        cashbackPercent: { type: number }
        depositPercent: { type: number }
        minParticipants: { type: number }
        joinedCount: { type: number }
        endsAt: { type: string }
        status: { type: string }
        myOrder:
          anyOf:
            - $ref: "#/components/schemas/GroupBuyOrder"
            - type: "null"
      required: [id, title, image, category, originalPrice, groupPrice, cashbackPercent, depositPercent, minParticipants, joinedCount, endsAt, status, myOrder]
    JoinGroupBuyRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 11, maxLength: 20 }
        address: { type: string, minLength: 10, maxLength: 500 }
        quantity: { type: number, minimum: 1, maximum: 5 }
        paymentMethod: { type: string, enum: [bkash, nagad, card] }
      required: [fullName, phone, address, quantity, paymentMethod]
    GroupBuyOrder:
      type: object
      properties:
        id: { type: string }
        dealId: { type: string }
        fullName: { type: string }
        phone: { type: string }
        address: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        totalAmount: { type: number }
        depositPaid: { type: number }
        dueAmount: { type: number }
        paymentMethod: { type: string }
        paymentRef:
          type: ["string", "null"]
        status: { type: string }
        createdAt: { type: string }
      required: [id, dealId, fullName, phone, address, quantity, unitPrice, totalAmount, depositPaid, dueAmount, paymentMethod, paymentRef, status, createdAt]
    Coupon:
      type: object
      properties:
        id: { type: string }
        scope: { type: string }
        storeId:
          type: ["string", "null"]
        storeName:
          type: ["string", "null"]
        code: { type: string }
        title: { type: string }
        discountType: { type: string }
        discountValue: { type: number }
        minOrderValue: { type: number }
        maxUses: { type: number }
        usedCount: { type: number }
        categoryId:
          type: ["string", "null"]
        startsAt: { type: string }
        endsAt: { type: string }
