openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Customer marketplace discovery
  - name: wallet
    description: Customer wallet summary
  - name: merchant
    description: Merchant store and catalog management
  - name: groupBuy
    description: Group buy deals and reservations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /marketplace/summary:
    get:
      operationId: getMarketplaceSummary
      tags: [marketplace]
      summary: Get the marketplace home summary
      description: Returns curated categories, featured products, active deals, and wallet highlights.
      responses:
        "200":
          description: Marketplace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSummary"
  /marketplace/categories:
    get:
      operationId: listMarketplaceCategories
      tags: [marketplace]
      summary: List marketplace categories
      responses:
        "200":
          description: Marketplace categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceCategory"
  /marketplace/products:
    get:
      operationId: listMarketplaceProducts
      tags: [marketplace]
      summary: List marketplace products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Marketplace products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceProduct"
  /wallet/summary:
    get:
      operationId: getWalletSummary
      tags: [wallet]
      summary: Get the customer wallet summary
      responses:
        "200":
          description: Wallet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummary"
  /merchant/summary:
    get:
      operationId: getMerchantSummary
      tags: [merchant]
      summary: Get the signed-in merchant workspace summary
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantSummary"
        "401":
          description: Authentication required
  /merchant/store:
    get:
      operationId: getMerchantStore
      tags: [merchant]
      summary: Get the signed-in merchant store
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantStore"
        "401":
          description: Authentication required
        "404":
          description: Store not found
    post:
      operationId: createMerchantStore
      tags: [merchant]
      summary: Create the signed-in merchant store
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMerchantStoreRequest"
      responses:
        "201":
          description: Merchant store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantStore"
        "400":
          description: Invalid store
        "401":
          description: Authentication required
        "409":
          description: Store already exists
  /merchant/products:
    get:
      operationId: listMerchantProducts
      tags: [merchant]
      summary: List products owned by the signed-in merchant
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantProduct"
        "401":
          description: Authentication required
    post:
      operationId: createMerchantProduct
      tags: [merchant]
      summary: Create a product in the signed-in merchant store
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMerchantProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
        "404":
          description: Store or category not found
  /merchant/products/{id}:
    patch:
      operationId: updateMerchantProduct
      tags: [merchant]
      summary: Update a product owned by the signed-in merchant
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMerchantProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
        "404":
          description: Product not found
    delete:
      operationId: deleteMerchantProduct
      tags: [merchant]
      summary: Archive a product owned by the signed-in merchant
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Product archived
        "401":
          description: Authentication required
        "404":
          description: Product not found
  /group-buys:
    get:
      operationId: listGroupBuyDeals
      tags: [groupBuy]
      summary: List open group buy deals
      description: Returns all group buy deals with live participation counts. When signed in, includes the caller's reservation if any.
      responses:
        "200":
          description: Group buy deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupBuyDeal"
  /group-buys/{id}/join:
    post:
      operationId: joinGroupBuyDeal
      tags: [groupBuy]
      summary: Join a group buy deal with an order form and deposit payment
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupBuyRequest"
      responses:
        "201":
          description: Reservation created and deposit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupBuyOrder"
        "400":
          description: Invalid order form
        "401":
          description: Authentication required
        "404":
          description: Deal not found
        "409":
          description: Already joined or deal closed
  /merchant/orders:
    get:
      operationId: listMerchantOrders
      tags: [merchant]
      summary: List orders for the signed-in merchant store
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantOrder"
        "401":
          description: Authentication required
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketplaceCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        productCount:
          type: number
      required: [id, name, icon, productCount]
    MarketplaceProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        cashbackPercent:
          type: number
        rating:
          type: number
        reviewCount:
          type: number
        image:
          type: string
        badge:
          type: ["string", "null"]
        merchant:
          type: string
      required: [id, name, brand, category, price, originalPrice, cashbackPercent, rating, reviewCount, image, badge, merchant]
    MarketplaceDeal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        accent:
          type: string
        endsAt:
          type: string
        cashbackPercent:
          type: number
      required: [id, title, subtitle, accent, endsAt, cashbackPercent]
    WalletSummary:
      type: object
      properties:
        balance:
          type: number
        pendingCashback:
          type: number
        availableCashback:
          type: number
        rewardPoints:
          type: number
      required: [balance, pendingCashback, availableCashback, rewardPoints]
    MarketplaceSummary:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceCategory"
        featuredProducts:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceProduct"
        deals:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceDeal"
        wallet:
          $ref: "#/components/schemas/WalletSummary"
      required: [categories, featuredProducts, deals, wallet]
    MerchantStore:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        logoUrl: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, name, slug, description, logoUrl, status, createdAt, updatedAt]
    CreateMerchantStoreRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        logoUrl: { type: string }
      required: [name]
    MerchantProduct:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        name: { type: string }
        description: { type: string }
        brand: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        cashbackPercent: { type: number }
        imageUrl: { type: string }
        stock: { type: number }
        available: { type: boolean }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, storeId, categoryId, categoryName, name, description, brand, price, originalPrice, cashbackPercent, imageUrl, stock, available, status, createdAt, updatedAt]
    CreateMerchantProductRequest:
      type: object
      properties:
        categoryId: { type: string }
        name: { type: string }
        description: { type: string }
        brand: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        cashbackPercent: { type: number }
        imageUrl: { type: string }
        stock: { type: number }
        available: { type: boolean }
      required: [categoryId, name, brand, price, originalPrice, cashbackPercent, imageUrl, stock, available]
    UpdateMerchantProductRequest:
      type: object
      properties:
        categoryId: { type: string }
        name: { type: string }
        description: { type: string }
        brand: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        cashbackPercent: { type: number }
        imageUrl: { type: string }
        stock: { type: number }
        available: { type: boolean }
        status: { type: string }
    MerchantOrder:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        customerId: { type: string }
        total: { type: number }
        cashback: { type: number }
        itemsCount: { type: number }
        status: { type: string }
        createdAt: { type: string }
      required: [id, storeId, customerId, total, cashback, itemsCount, status, createdAt]
    GroupBuyDeal:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        image: { type: string }
        category: { type: string }
        originalPrice: { type: number }
        groupPrice: { type: number }
        cashbackPercent: { type: number }
        depositPercent: { type: number }
        minParticipants: { type: number }
        joinedCount: { type: number }
        endsAt: { type: string }
        status: { type: string }
        myOrder:
          anyOf:
            - $ref: "#/components/schemas/GroupBuyOrder"
            - type: "null"
      required: [id, title, image, category, originalPrice, groupPrice, cashbackPercent, depositPercent, minParticipants, joinedCount, endsAt, status, myOrder]
    JoinGroupBuyRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 11, maxLength: 20 }
        address: { type: string, minLength: 10, maxLength: 500 }
        quantity: { type: number, minimum: 1, maximum: 5 }
        paymentMethod: { type: string, enum: [bkash, nagad, card] }
      required: [fullName, phone, address, quantity, paymentMethod]
    GroupBuyOrder:
      type: object
      properties:
        id: { type: string }
        dealId: { type: string }
        fullName: { type: string }
        phone: { type: string }
        address: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        totalAmount: { type: number }
        depositPaid: { type: number }
        dueAmount: { type: number }
        paymentMethod: { type: string }
        paymentRef: { type: string }
        status: { type: string }
        createdAt: { type: string }
      required: [id, dealId, fullName, phone, address, quantity, unitPrice, totalAmount, depositPaid, dueAmount, paymentMethod, paymentRef, status, createdAt]
    MerchantSummary:
      type: object
      properties:
        store:
          anyOf:
            - $ref: "#/components/schemas/MerchantStore"
            - type: "null"
        productCount: { type: number }
        activeProductCount: { type: number }
        orderCount: { type: number }
        grossSales: { type: number }
        cashbackIssued: { type: number }
        pendingOrders: { type: number }
      required: [store, productCount, activeProductCount, orderCount, grossSales, cashbackIssued, pendingOrders]

