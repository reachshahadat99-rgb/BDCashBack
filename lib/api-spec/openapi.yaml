openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Customer marketplace discovery
  - name: wallet
    description: Customer wallet summary
  - name: cart
    description: Customer cart management
  - name: orders
    description: Customer orders
  - name: merchant
    description: Merchant store and catalog management
  - name: groupBuy
    description: Group buy deals and reservations
  - name: coupons
    description: Discount coupons
  - name: promoDeals
    description: Merchant promotional deals
  - name: giftCards
    description: Discounted digital gift cards
  - name: admin
    description: Platform administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /marketplace/summary:
    get:
      operationId: getMarketplaceSummary
      tags: [marketplace]
      summary: Get the marketplace home summary
      description: Returns curated categories, featured products, active deals, and wallet highlights.
      responses:
        "200":
          description: Marketplace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSummary"
  /marketplace/categories:
    get:
      operationId: listMarketplaceCategories
      tags: [marketplace]
      summary: List marketplace categories
      responses:
        "200":
          description: Marketplace categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceCategory"
  /marketplace/products:
    get:
      operationId: listMarketplaceProducts
      tags: [marketplace]
      summary: List marketplace products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Marketplace products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceProduct"
  /wallet/summary:
    get:
      operationId: getWalletSummary
      tags: [wallet]
      summary: Get the customer wallet summary
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Wallet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummary"
        "401":
          description: Authentication required
  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: List wallet transactions for the signed-in user
      security: [{ clerkSession: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Wallet transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
        "401":
          description: Authentication required
  /wallet/withdraw:
    post:
      operationId: requestWithdrawal
      tags: [wallet]
      summary: Request a withdrawal of available balance
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithdrawalRequest"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequest"
        "400":
          description: Invalid request or insufficient balance
        "401":
          description: Authentication required
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the signed-in user's cart
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          description: Authentication required
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear all items from the cart
      security: [{ clerkSession: [] }]
      responses:
        "204":
          description: Cart cleared
        "401":
          description: Authentication required
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid request or product unavailable
        "401":
          description: Authentication required
        "404":
          description: Product not found
  /cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update quantity of a cart item
      security: [{ clerkSession: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid quantity
        "401":
          description: Authentication required
        "404":
          description: Item not found
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove an item from the cart
      security: [{ clerkSession: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Item removed
        "401":
          description: Authentication required
        "404":
          description: Item not found
  /checkout:
    post:
      operationId: checkout
      tags: [orders]
      summary: Place an order from the current cart
      security: [{ clerkSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOrder"
        "400":
          description: Cart is empty or a product is unavailable
        "401":
          description: Authentication required
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the signed-in user's orders
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerOrder"
        "401":
          description: Authentication required
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order with its line items
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOrderDetail"
        "401":
          description: Authentication required
        "404":
          description: Order not found
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order (only allowed before it is shipped)
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOrder"
        "400":
          description: Order cannot be cancelled in its current state
        "401":
          description: Authentication required
        "404":
          description: Order not found
  /merchant/summary:
    get:
      operationId: getMerchantSummary
      tags: [merchant]
      summary: Get the signed-in merchant workspace summary
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantSummary"
        "401":
          description: Authentication required
  /merchant/store:
    get:
      operationId: getMerchantStore
      tags: [merchant]
      summary: Get the signed-in merchant store
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantStore"
        "401":
          description: Authentication required
        "404":
          description: Store not found
    post:
      operationId: createMerchantStore
      tags: [merchant]
      summary: Create the signed-in merchant store
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMerchantStoreRequest"
      responses:
        "201":
          description: Merchant store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantStore"
        "400":
          description: Invalid store
        "401":
          description: Authentication required
        "409":
          description: Store already exists
  /merchant/products:
    get:
      operationId: listMerchantProducts
      tags: [merchant]
      summary: List products owned by the signed-in merchant
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantProduct"
        "401":
          description: Authentication required
    post:
      operationId: createMerchantProduct
      tags: [merchant]
      summary: Create a product in the signed-in merchant store
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMerchantProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
        "404":
          description: Store or category not found
  /merchant/products/{id}:
    patch:
      operationId: updateMerchantProduct
      tags: [merchant]
      summary: Update a product owned by the signed-in merchant
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMerchantProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          description: Invalid product
        "401":
          description: Authentication required
        "404":
          description: Product not found
    delete:
      operationId: deleteMerchantProduct
      tags: [merchant]
      summary: Archive a product owned by the signed-in merchant
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Product archived
        "401":
          description: Authentication required
        "404":
          description: Product not found
  /group-buys:
    get:
      operationId: listGroupBuyDeals
      tags: [groupBuy]
      summary: List open group buy deals
      description: Returns all group buy deals with live participation counts. When signed in, includes the caller's reservation if any.
      responses:
        "200":
          description: Group buy deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupBuyDeal"
  /group-buys/{id}/join:
    post:
      operationId: joinGroupBuyDeal
      tags: [groupBuy]
      summary: Join a group buy deal with an order form and deposit payment
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupBuyRequest"
      responses:
        "201":
          description: Reservation created and deposit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupBuyOrder"
        "400":
          description: Invalid order form
        "401":
          description: Authentication required
        "404":
          description: Deal not found
        "409":
          description: Already joined or deal closed
  /merchant/orders:
    get:
      operationId: listMerchantOrders
      tags: [merchant]
      summary: List orders for the signed-in merchant store
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantOrder"
        "401":
          description: Authentication required
  /merchant/orders/{id}/status:
    patch:
      operationId: updateMerchantOrderStatus
      tags: [merchant]
      summary: Advance the fulfillment status of a merchant order (pending → processing → shipped → delivered)
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMerchantOrderStatusRequest"
      responses:
        "200":
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantOrder"
        "400":
          description: Invalid status transition
        "401":
          description: Authentication required
        "404":
          description: Order not found
  /coupons:
    get:
      operationId: listPublicCoupons
      tags: [coupons]
      summary: List approved, currently valid coupons
      responses:
        "200":
          description: Coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [coupons]
      summary: Validate a coupon against an order subtotal (checkout integration point)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCouponRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponValidationResult"
  /promo-deals:
    get:
      operationId: listPromoDeals
      tags: [promoDeals]
      summary: List approved promotional deals in their campaign window
      parameters:
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Promotional deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoDeal"
  /gift-cards:
    get:
      operationId: listGiftCardBrands
      tags: [giftCards]
      summary: List active gift card brands with available cards
      responses:
        "200":
          description: Gift card brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GiftCardBrandView"
  /gift-cards/{id}/purchase:
    post:
      operationId: purchaseGiftCard
      tags: [giftCards]
      summary: Purchase a discounted gift card (delivered digitally)
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseGiftCardRequest"
      responses:
        "201":
          description: Gift card delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCardPurchase"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Gift card not found
        "409":
          description: Out of stock or unavailable
  /gift-cards/orders:
    get:
      operationId: listMyGiftCardOrders
      tags: [giftCards]
      summary: List the signed-in customer's purchased gift cards
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Purchased gift cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GiftCardPurchase"
        "401":
          description: Authentication required
  /merchant/coupons:
    get:
      operationId: listMerchantCoupons
      tags: [coupons]
      summary: List coupons for the signed-in merchant store
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
        "401":
          description: Authentication required
    post:
      operationId: createMerchantCoupon
      tags: [coupons]
      summary: Create a store coupon (pending admin approval)
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponRequest"
      responses:
        "201":
          description: Coupon created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Invalid coupon
        "401":
          description: Authentication required
        "404":
          description: Store not found
        "409":
          description: Code already in use
  /merchant/coupons/{id}:
    patch:
      operationId: updateMerchantCoupon
      tags: [coupons]
      summary: Update or archive a store coupon
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCouponRequest"
      responses:
        "200":
          description: Coupon updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Invalid update
        "401":
          description: Authentication required
        "404":
          description: Coupon not found
  /merchant/deals:
    get:
      operationId: listMerchantDeals
      tags: [promoDeals]
      summary: List promotional deals for the signed-in merchant store
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoDeal"
        "401":
          description: Authentication required
    post:
      operationId: createMerchantDeal
      tags: [promoDeals]
      summary: Create a promotional deal (pending admin approval)
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromoDealRequest"
      responses:
        "201":
          description: Deal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoDeal"
        "400":
          description: Invalid deal
        "401":
          description: Authentication required
        "404":
          description: Store not found
  /merchant/deals/{id}:
    patch:
      operationId: updateMerchantDeal
      tags: [promoDeals]
      summary: Update a promotional deal owned by the signed-in merchant
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromoDealRequest"
      responses:
        "200":
          description: Deal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoDeal"
        "400":
          description: Invalid update
        "401":
          description: Authentication required
        "404":
          description: Deal not found
  /merchant/group-buys:
    get:
      operationId: listMerchantGroupBuys
      tags: [groupBuy]
      summary: List group buy campaigns for the signed-in merchant store
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant group buy campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupBuyCampaign"
        "401":
          description: Authentication required
    post:
      operationId: createMerchantGroupBuy
      tags: [groupBuy]
      summary: Create a group buy campaign (pending admin approval)
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBuyCampaignRequest"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupBuyCampaign"
        "400":
          description: Invalid campaign
        "401":
          description: Authentication required
        "404":
          description: Store not found
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check whether the signed-in user is a platform admin
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Authentication required
  /admin/claim:
    post:
      operationId: claimAdmin
      tags: [admin]
      summary: Claim the first platform admin seat (only when no admin exists)
      security: [{ clerkSession: [] }]
      responses:
        "201":
          description: Admin seat claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Authentication required
        "409":
          description: An admin already exists
  /admin/merchants:
    get:
      operationId: listAdminMerchants
      tags: [admin]
      summary: List merchant stores for approval and management
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Merchant stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMerchant"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
  /admin/merchants/{id}:
    patch:
      operationId: updateAdminMerchant
      tags: [admin]
      summary: Approve or suspend a merchant store
      security: [{ clerkSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMerchantStatusRequest"
      responses:
        "200":
          description: Merchant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMerchant"
        "400":
          description: Invalid status
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Store not found
  /admin/coupons:
    get:
      operationId: listAdminCoupons
      tags: [admin]
      summary: List all coupons including pending merchant coupons
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: All coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
    post:
      operationId: createAdminCoupon
      tags: [admin]
      summary: Create a global coupon (auto-approved)
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponRequest"
      responses:
        "201":
          description: Global coupon created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Invalid coupon
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "409":
          description: Code already in use
  /admin/coupons/{id}:
    patch:
      operationId: moderateAdminCoupon
      tags: [admin]
      summary: Approve, reject, or archive any coupon
